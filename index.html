  <!--
    Google Search Console verification
    1) افتح https://search.google.com/search-console
    2) Add property → URL prefix → https://www.mel.iq/
    3) اختر HTML tag وانسخ قيمة content فقط
    4) الصقها بين علامتي الاقتباس أدناه، اعمل deploy، ثم اضغط Verify
    5) بعدها: Sitemaps → أرسل: sitemap.xml
  -->
  <!-- <meta name="google-site-verification" content="الصق_الكود_هنا" /> -->

  <!-- Agent discovery (HTML hints; Link response headers also advertise these) -->
  <link rel="api-catalog" href="/.well-known/api-catalog" />
  <link rel="describedby" href="/.well-known/ai-catalog.json" type="application/json" />
  <link rel="service-desc" href="/docs/openapi.json" type="application/json" />
  <link rel="service-doc" href="/auth.md" type="text/markdown" />

  <meta name="twitter:image" content="https://www.mel.iq/og-image.jpg" />

  <!--
    Favicons for browser tabs + Google Search.
    Google needs a square icon that is a multiple of 48px (48, 96, 192…).
    PNG is listed before SVG so crawlers that ignore SVG still get a mark.
  -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <link rel="icon" href="/mel-logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#060b18" />

  <!-- LCP: hero phone mockup (WebP). Discover early so Slow-4G mobile is not
       waiting on the JS bundle to insert the <img>. -->
  <link
    rel="preload"
    as="image"
    type="image/webp"
    href="/images/landing/hero-phone-420.webp"
    imagesrcset="/images/landing/hero-phone-420.webp 420w, /images/landing/hero-phone.webp 840w"
    imagesizes="(min-width: 1024px) 560px, min(100vw - 2rem, 420px)"
    fetchpriority="high"
  />

  <!-- Cairo is only a fallback behind self-hosted Setar XS. Load it async so
       it cannot block first paint the way a synchronous stylesheet would. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    />
  </noscript>
